<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Show Control</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      main { display: block; padding: 32px; }
      .views { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; max-width: 1000px; }
      a.view {
        display: block; padding: 24px; background: var(--panel); border: 1px solid var(--line);
        border-radius: 10px; color: var(--text); text-decoration: none;
      }
      a.view:hover { border-color: var(--accent); }
      a.view h2 { margin: 0 0 6px; font-size: 20px; }
      a.view p { margin: 0; color: var(--dim); font-size: 14px; }
      .status { color: var(--dim); margin-top: 24px; }
    </style>
  </head>
  <body>
    <header><h1>Show Control</h1></header>

    <main>
      <div class="views">
        <a class="view" href="/sm.html"><h2>Stage Manager</h2><p>Cue list, GO and STOP, edit cues</p></a>
        <a class="view" href="/lights.html"><h2>Lights</h2><p>24 faders, record looks into cues</p></a>
        <a class="view" href="/sound.html"><h2>Sound</h2><p>Audio files, playback, previews</p></a>
        <a class="view" href="/actor.html"><h2>Script</h2><p>Follow the script with the live cue marked</p></a>
      </div>
      <p class="status" id="status">Connecting…</p>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      socket.on("state", ({ currentCue, cues }) => {
        const cue = cues[currentCue];
        document.getElementById("status").textContent = cue
          ? `Live: cue ${cue.number} ${cue.label}  ·  ${cues.length} cues`
          : `Top of show  ·  ${cues.length} cues`;
      });
    </script>
  </body>
</html>
