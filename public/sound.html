<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sound</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      header .master { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
      header .master input { width: 140px; }
      header .master select { max-width: 220px; padding: 5px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
      #armState { color: var(--standby); font-size: 13px; }
      #armState.on { color: #3fdc5a; }

      main { grid-template-columns: 1fr 380px; overflow: hidden; }            /* Edit: playback · now playing */
      body.mode-show main { grid-template-columns: 1fr 380px 340px; } /* Show: + live script */
      #liveScript { min-height: 0; }

      .left { overflow: auto; }
      section { padding: 16px; border-bottom: 1px solid var(--line); }
      section h3 { margin: 0 0 10px; }
      .dim { color: var(--dim); font-size: 13px; }

      .row { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid var(--line); }
      .row span { flex: 1; }
      .row .dur { flex: none; font-family: Menlo, monospace; font-size: 12px; color: var(--dim); }
      td button { padding: 4px 10px; font-size: 13px; }
      button.fire { background: var(--go); border-color: var(--go); font-weight: bold; }

      .drop { margin-top: 12px; padding: 22px; border: 2px dashed var(--line); border-radius: 8px; text-align: center; color: var(--dim); }
      .drop.over { border-color: var(--accent); color: var(--text); }
      .drop .link { color: var(--accent); cursor: pointer; text-decoration: underline; }

      /* now playing cards */
      .card { background: #161616; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .card .name { font-weight: 600; margin-bottom: 8px; }
      .card .name small { color: var(--dim); font-weight: normal; margin-left: 6px; }
      .meter { height: 6px; background: #000; border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
      .meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, #3fdc5a 70%, #f2c94c 88%, #ff4040); transition: width 0.08s; }
      .bar { position: relative; height: 14px; background: #000; border-radius: 4px; overflow: hidden; cursor: pointer; }
      .bar .fill { height: 100%; width: 0; background: var(--accent); }
      .times { display: flex; justify-content: space-between; font-family: Menlo, monospace; font-size: 12px; color: var(--dim); margin: 4px 0 8px; }
      .card .controls { display: flex; align-items: center; gap: 8px; }
      .card .controls input { flex: 1; }
      .card .controls button { padding: 5px 10px; font-size: 13px; }
      .card.paused { opacity: 0.7; }
    </style>
  </head>
  <body>
    <script src="/nav.js"></script>
    <header>
      <h1>Sound</h1>
      <span id="armState">Not armed</span>
      <button id="arm">Arm audio</button>
      <label class="master">Output <select id="outDev" title="Where this computer plays sound: speakers, or the SQ over USB"></select></label>
      <label class="master">Playback master <input id="master" type="range" min="0" max="100" value="100" /> <b id="masterText">100%</b></label>
      <button id="stop">Fade all out</button>
    </header>

    <main>
      <div class="left">
        <section class="cuelist">
          <h3>Sound cues</h3>
          <table>
            <thead><tr><th>#</th><th>Label</th><th>File</th><th>Vol</th><th>In / out</th><th></th></tr></thead>
            <tbody id="cueRows"></tbody>
          </table>
          <p class="dim" id="noCues" hidden>No sound cues yet. Add one on the Stage Manager page and set its type to sound.</p>
        </section>
        <section>
          <h3>Files in public/audio</h3>
          <div id="files"></div>
          <div class="drop" id="drop" data-edit-only>
            Drop audio files here, or <label class="link">choose files<input type="file" id="pick" accept="audio/*" multiple hidden /></label>
          </div>
          <p class="dim" id="uploadStatus"></p>
        </section>
      </div>
      <aside class="inspector">
        <h3>Now playing</h3>
        <div id="playing"></div>
        <p class="dim" id="nothing">Nothing playing.</p>
      </aside>
      <section id="liveScript" data-show-only></section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/livescript.js"></script>
    <script src="/audio-player.js"></script>
    <script>
      const socket = io();
      installLiveScript(document.getElementById("liveScript"), socket);
      const $ = (id) => document.getElementById(id);
      const fmt = (s) => (isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "–:––");
      let cues = [];

      // ---- level meters through Web Audio. Each player gets an analyser; we read its loudness 10x a second.
      let ctx = null;
      const meters = new Map(); // Audio -> AnalyserNode
      onPlayerStart = (a) => {
        try {
          if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            applyOutput(); // send it to the chosen device straight away
          }
          if (ctx.state === "suspended") ctx.resume();
          const src = ctx.createMediaElementSource(a);
          const an = ctx.createAnalyser();
          an.fftSize = 512;
          src.connect(an);
          an.connect(ctx.destination); // still has to reach the speakers
          meters.set(a, an);
        } catch (err) { console.log("meter unavailable", err.message); }
      };
      function loudness(a) {
        const an = meters.get(a);
        if (!an || a.paused) return 0;
        const buf = new Uint8Array(an.fftSize);
        an.getByteTimeDomainData(buf);
        let sum = 0;
        for (const v of buf) { const x = (v - 128) / 128; sum += x * x; }
        return Math.sqrt(sum / buf.length); // 0 silence, about 0.3 loud
      }

      // ---- output device: the laptop speakers, or the SQ's USB channels when the desk is plugged in by USB.
      // Every player on this page runs through the AudioContext (for the meters), so one setSinkId covers them all.
      let outputId = "default";
      try { outputId = localStorage.getItem("audioOutput") || "default"; } catch {}
      async function listOutputs() {
        try {
          const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audiooutput");
          const sel = $("outDev");
          sel.innerHTML = "";
          sel.add(new Option("System default", "default"));
          devices.forEach((d, i) => { if (d.deviceId && d.deviceId !== "default") sel.add(new Option(d.label || "Audio output " + (i + 1), d.deviceId)); });
          sel.value = outputId;
          if (!sel.value) sel.value = "default";
        } catch (err) { console.log("output devices:", err.message); }
      }
      async function applyOutput() {
        try {
          if (ctx && ctx.setSinkId) await ctx.setSinkId(outputId === "default" ? "" : outputId);
        } catch (err) {
          console.log("could not switch output:", err.message);
          $("outDev").value = outputId = "default";
        }
      }
      $("outDev").onchange = (e) => {
        outputId = e.target.value;
        try { localStorage.setItem("audioOutput", outputId); } catch {}
        applyOutput();
      };
      navigator.mediaDevices?.addEventListener("devicechange", listOutputs);
      listOutputs();

      // Browsers block sound until the page has been clicked. In the app this is already allowed.
      $("arm").onclick = () => {
        ctx ||= new (window.AudioContext || window.webkitAudioContext)();
        ctx.resume();
        $("armState").textContent = "Armed";
        $("armState").className = "on";
      };
      $("master").oninput = (e) => {
        setMasterVolume(e.target.value / 100);
        $("masterText").textContent = e.target.value + "%";
      };
      $("stop").onclick = () => socket.emit("stopSound");

      // ---- now playing cards: rebuilt when a player starts or stops, repainted 10x a second
      const cards = new Map(); // Audio -> card element
      function buildCards() {
        const box = $("playing");
        box.innerHTML = "";
        cards.clear();
        $("nothing").hidden = players.size > 0;
        for (const [a, entry] of players) {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="name">${entry.label}${a.loop ? "<small>↻ loop</small>" : ""}</div>
            <div class="meter"><div class="fill"></div></div>
            <div class="bar"><div class="fill"></div></div>
            <div class="times"><span class="el">0:00</span><span class="rem"></span></div>
            <div class="controls">
              <input type="range" min="0" max="100" value="${Math.round(entry.volume * 100)}" title="Volume" />
              <button class="pause">Pause</button>
              <button class="out">Fade out</button>
            </div>`;
          card.querySelector(".bar").onclick = (e) => { // click anywhere on the bar to jump there
            const r = e.currentTarget.getBoundingClientRect();
            if (a.duration) a.currentTime = ((e.clientX - r.left) / r.width) * a.duration;
          };
          card.querySelector("input").oninput = (e) => setPlayerVolume(a, e.target.value / 100);
          card.querySelector(".pause").onclick = (e) => {
            if (a.paused) { a.play(); e.target.textContent = "Pause"; card.classList.remove("paused"); }
            else { a.pause(); e.target.textContent = "Resume"; card.classList.add("paused"); }
          };
          card.querySelector(".out").onclick = () => stopPlayer(a);
          box.appendChild(card);
          cards.set(a, card);
        }
      }
      function paintCards() {
        for (const [a, card] of cards) {
          const frac = a.duration ? a.currentTime / a.duration : 0;
          card.querySelector(".bar .fill").style.width = frac * 100 + "%";
          card.querySelector(".el").textContent = fmt(a.currentTime);
          card.querySelector(".rem").textContent = a.duration ? "-" + fmt(a.duration - a.currentTime) : "";
          card.querySelector(".meter .fill").style.width = Math.min(100, loudness(a) * 300) + "%";
        }
      }
      onPlayersChange = buildCards;
      setInterval(paintCards, 100);
      listenForSound(socket);

      // ---- file list, with durations read from each file's header
      const durations = new Map();
      function duration(file, el) {
        if (durations.has(file)) return (el.textContent = fmt(durations.get(file)));
        const probe = new Audio("/audio/" + file);
        probe.preload = "metadata";
        probe.onloadedmetadata = () => { durations.set(file, probe.duration); el.textContent = fmt(probe.duration); };
      }

      // ---- uploads: PUT each file to /audio/<name>; the server then sends everyone the new list
      async function upload(fileList) {
        for (const f of fileList) {
          $("uploadStatus").textContent = "Uploading " + f.name + "…";
          const res = await fetch("/audio/" + encodeURIComponent(f.name), { method: "PUT", body: f });
          $("uploadStatus").textContent = res.ok ? "Uploaded " + f.name : "Could not upload " + f.name + ": " + (await res.text());
        }
      }
      $("pick").onchange = (e) => upload(e.target.files);
      const drop = $("drop");
      drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
      drop.ondragleave = () => drop.classList.remove("over");
      drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };

      // ---- the server is the source of truth
      socket.on("state", (state) => {
        cues = state.cues;
        const rows = $("cueRows");
        rows.innerHTML = "";
        let count = 0;
        cues.forEach((cue, i) => {
          if (cue.type !== "sound") return;
          count++;
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${cue.number}</td><td>${cue.label}</td><td>${cue.file || "<i>no file</i>"}</td>
            <td>${Math.round((cue.volume ?? 1) * 100)}%</td>
            <td>${cue.fadeIn || 0}s / ${cue.fadeOut ?? 1}s${cue.loop ? " ↻" : ""}</td>
            <td><button class="fire">Fire</button> <button class="pre">Preview</button></td>`;
          tr.querySelector(".fire").onclick = () => socket.emit("fire", i); // fires for everyone, like GO would
          tr.querySelector(".pre").onclick = () => play(cue.file, { ...cue, label: cue.number + " · " + cue.label + " (preview)" }); // just here
          rows.appendChild(tr);
        });
        $("noCues").hidden = count > 0;

        const box = $("files");
        box.innerHTML = "";
        for (const file of state.audioFiles) {
          const row = document.createElement("div");
          row.className = "row";
          row.innerHTML = `<span>${file}</span><span class="dur">…</span><button>Preview</button>`;
          duration(file, row.querySelector(".dur"));
          row.querySelector("button").onclick = () => play(file, { label: file + " (preview)" });
          box.appendChild(row);
        }
      });
    </script>
  </body>
</html>
