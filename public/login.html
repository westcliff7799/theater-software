<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      main {
        display: block;
        max-width: 380px;
        margin: 100px auto 0;
        padding: 24px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      p {
        color: var(--dim);
        margin: 0 0 18px;
      }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        font-size: 20px;
        font-family: Menlo, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 10px 12px;
        margin-bottom: 10px;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      input:focus {
        outline: none;
        border-color: #3fdc5a;
      }
      .err {
        color: #e07070;
        min-height: 1.4em;
        margin: 0 0 8px;
      }
      button {
        width: 100%;
        padding: 10px;
        font-size: 15px;
      }
      .admin {
        margin: 24px 0 0;
        text-align: center;
        font-size: 13px;
      }
      .admin a {
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Show Control</h1>
      <p>Enter the key you were given.</p>
      <input id="key" placeholder="SIX-LX-4KQ2" autofocus />
      <p class="err" id="err"></p>
      <button id="go">Enter</button>
      <p class="admin"><a href="/admin.html">Admin sign in</a></p>
    </main>
    <script>
      async function enter() {
        const r = await fetch("/auth/key", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ key: document.getElementById("key").value }),
        });
        if (r.ok) location.href = "/";
        else
          document.getElementById("err").textContent = (await r.json()).error;
      }
      document.getElementById("go").onclick = enter;
      document.getElementById("key").onkeydown = (e) => {
        if (e.key === "Enter") enter();
      };
    </script>
  </body>
</html>
