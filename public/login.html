<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sign in</title>
  <link rel="stylesheet" href="/style.css">
  <!-- Google's sign-in library. It looks for the two divs below and draws the button itself. -->
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body>
  <h1>Show Server</h1>

  <!-- data-callback names a global function to call with the ID token. The client id is filled in by the /login route. -->
  <div id="g_id_onload" data-client_id="__CLIENT_ID__" data-callback="onGoogle"></div>
  <div class="g_id_signin" data-type="standard"></div>

  <p>or</p>
  <button onclick="guest()">Continue as guest</button>

  <script>
    // POST a JSON body, then go to Home if the server said ok
    async function send(url, body) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (r.ok) location.href = "/";
      else alert("Sign-in failed");
    }
    // resp.credential is the ID token. We never decode it here; only the server's check matters.
    function onGoogle(resp) { send("/auth/google", { credential: resp.credential }); }
    function guest() { send("/auth/guest", {}); }
  </script>
</body>
</html>
