<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stage Manager</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      header .clock { font-family: Menlo, monospace; font-size: 22px; color: var(--dim); min-width: 90px; }
      header label { color: var(--dim); font-size: 13px; }

      .list { display: flex; flex-direction: column; }
      .list table { flex: none; }
      .scroll { flex: 1; overflow: auto; }

      /* live / standby display */
      .now { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
      .now > div { padding: 12px 16px; }
      .now small { display: block; font-size: 11px; letter-spacing: 3px; color: var(--dim); margin-bottom: 4px; }
      .now b { font-size: 22px; font-weight: 600; }
      .now .live { background: var(--live); }
      .now .live b { color: #7fe89a; }
      .now .next { background: #2a2410; }

      /* live script between the cue list and the inspector (livescript.js) */
      main { grid-template-columns: 1fr 320px; }               /* Edit: cues · Selected cue */
      body.mode-show main { grid-template-columns: 1fr 440px; } /* Show: cues · live script */
      .livescript { border-top: none; border-bottom: none; }
      .now .next b { color: var(--standby); }

      .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
      .badge.light { background: #3a2d0c; color: #f2b84c; }
      .badge.sound { background: #0f2a44; color: #6cb5ff; }
      .badge.midi  { background: #2a1a44; color: #c08cff; }
      td.notes { color: var(--dim); font-size: 13px; }
      td.follow { color: var(--dim); font-size: 12px; white-space: nowrap; }

      .toolbar { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); background: var(--panel); }
      .toolbar .gap { flex: 1; }

      @media (max-width: 760px) {
        header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
        header h1 { font-size: 16px; }
        header .smfaders, header label, header #reset { display: none; }
        header .clock { font-size: 18px; min-width: 0; }
        header #stop, header #go { display: none; }     /* they live in the bar at the bottom instead */
        main, body.mode-show main { grid-template-columns: 1fr; }
        aside.inspector, #liveScript { display: none !important; }
        .now > div { padding: 10px 12px; }
        .now b { font-size: 18px; }
        th:nth-child(n+4), td:nth-child(n+4) { display: none; } /* cue, label, type fit a phone; the rest doesn't */
        td, th { padding: 12px 10px; }
        .toolbar { padding: 8px; gap: 8px; }
        .toolbar button { flex: 1; }
        .toolbar .gap { display: none; }
        .list { padding-bottom: 96px; }                  /* room for the bar */
        .gobar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); background: #0c0c0c; border-top: 1px solid var(--line); z-index: 20; }
        .gobar button { flex: 1; font-size: 22px; font-weight: bold; padding: 18px 0; }
        .gobar .go { flex: 2; background: var(--go); border-color: var(--go); font-size: 30px; }
      }
      .gobar { display: none; }
      @media (max-width: 760px) { .gobar { display: flex; } }

      .inspector textarea { width: 100%; min-height: 70px; padding: 6px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; font: inherit; font-size: 14px; resize: vertical; }
      .inspector .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; color: var(--text); font-size: 14px; }
      .inspector .check input { width: auto; }
      .inspector .hint { color: var(--dim); font-size: 12px; margin-top: 20px; line-height: 1.6; }
      .inspector .hint kbd { background: #111; border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px; font-family: Menlo, monospace; }
      .inspector p.none { color: var(--dim); }

      /* house / work light faders, shared with the lights page */
      .smfaders { display: flex; gap: 14px; align-items: center; }
      .smfaders label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--dim); }
      .smfaders input { width: 110px; }
      .smfaders b { color: #f5a623; font-weight: normal; font-family: Menlo, monospace; }
    </style>
  </head>
  <body>
    <script src="/nav.js"></script>
    <header>
      <h1>Stage Manager</h1>
      <span class="clock" id="clock">00:00</span>
      <span class="smfaders" id="smFaders"></span>
      <label><input type="checkbox" id="playHere" checked /> Play audio here</label>
      <button id="reset">Reset to top</button>
      <button id="stop">STOP</button>
      <button id="go" class="go">GO</button>
    </header>

    <div class="gobar"><button id="stopMobile">STOP</button><button id="goMobile" class="go">GO</button></div>

    <main>
      <div class="list">
        <div class="now">
          <div class="live"><small>LIVE</small><b id="liveCue">—</b></div>
          <div class="next"><small>STANDBY</small><b id="nextCue">—</b></div>
        </div>

        <div class="scroll">
          <table>
            <thead>
              <tr><th>#</th><th>Label</th><th>Type</th><th>Details</th><th>Fade</th><th>Follow</th><th>Notes</th></tr>
            </thead>
            <tbody id="cues"></tbody>
          </table>
        </div>

        <div class="toolbar">
          <button id="add" data-edit-only>+ Add cue</button>
          <button id="delete" data-edit-only>Delete</button>
          <button id="up" title="⌘↑" data-edit-only>▲</button>
          <button id="down" title="⌘↓" data-edit-only>▼</button>
          <span class="gap"></span>
          <button id="load" title="Enter">Load as standby</button>
          <button id="fire">Fire selected</button>
        </div>
      </div>

      <section id="liveScript" data-show-only></section>

      <aside class="inspector" data-edit-only>
        <h3>Selected cue</h3>
        <p class="none" id="noneSelected">Click a cue to edit it.</p>
        <div id="fields" hidden>
          <label>Number <input id="f-number" /></label>
          <label>Label <input id="f-label" /></label>
          <label>Type
            <select id="f-type"><option>light</option><option>sound</option><option>midi</option></select>
          </label>

          <div data-for="light">
            <label>Fade (seconds) <input id="f-fade" type="number" step="0.1" min="0" /></label>
            <label>Levels, channel:level <input id="f-levels" placeholder="1:255, 2:128" /></label>
          </div>
          <div data-for="sound">
            <label>Sound file <select id="f-file"></select></label>
            <label>Volume 0 to 1 <input id="f-volume" type="number" min="0" max="1" step="0.05" /></label>
            <label>Fade in (seconds) <input id="f-fadein" type="number" step="0.1" min="0" /></label>
            <label>Fade out on STOP (seconds) <input id="f-fadeout" type="number" step="0.1" min="0" /></label>
            <label class="check"><input type="checkbox" id="f-loop" /> Loop until stopped</label>
          </div>
          <div data-for="midi">
            <label>MIDI bytes <input id="f-bytes" placeholder="192, 4" /></label>
          </div>

          <label class="check"><input type="checkbox" id="f-follow" /> Auto-follow: fire the next cue by itself</label>
          <label>Wait before the next cue (seconds) <input id="f-wait" type="number" step="0.1" min="0" /></label>
          <label>Notes <textarea id="f-notes" placeholder="e.g. when Hamlet exits stage left"></textarea></label>
        </div>

        <div class="hint">
          <kbd>Space</kbd> GO &nbsp; <kbd>Esc</kbd> STOP<br />
          <kbd>↑</kbd> <kbd>↓</kbd> select &nbsp; <kbd>⌘↑</kbd> <kbd>⌘↓</kbd> reorder<br />
          <kbd>Enter</kbd> or double-click: load as standby
        </div>
      </aside>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/audio-player.js"></script>
    <script src="/livescript.js"></script>
    <script>
      const socket = io();
      const $ = (id) => document.getElementById(id);
      let cues = [], currentCue = -1, selected = -1, showStart = null;

      // ---- transport
      $("goMobile").onclick = () => $("go").click();
      $("stopMobile").onclick = () => $("stop").click();
      $("go").onclick = (e) => { socket.emit("go"); e.target.blur(); };
      $("stop").onclick = () => socket.emit("stop");
      $("reset").onclick = () => socket.emit("reset");
      $("load").onclick = () => { if (selected >= 0) socket.emit("setStandby", selected); };
      $("fire").onclick = () => { if (selected >= 0) socket.emit("fire", selected); };

      listenForSound(socket);
      $("playHere").onchange = (e) => { playHere = e.target.checked; };

      document.addEventListener("keydown", (e) => {
        if (["INPUT", "SELECT", "TEXTAREA"].includes(e.target.tagName)) return; // typing, not a key command
        if (e.code === "Space") { e.preventDefault(); socket.emit("go"); }
        else if (e.code === "Escape") socket.emit("stop");
        else if (e.code === "ArrowDown" || e.code === "ArrowUp") {
          e.preventDefault();
          const dir = e.code === "ArrowDown" ? 1 : -1;
          if (e.metaKey || e.ctrlKey) move(dir);
          else select(selected < 0 ? currentCue + 1 : selected + dir);
        }
        else if (e.code === "Enter" && selected >= 0) socket.emit("setStandby", selected);
      });

      // ---- show clock: runs from the first GO until Reset
      setInterval(() => {
        if (!showStart) return;
        const s = Math.floor((Date.now() - showStart) / 1000);
        $("clock").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }, 500);

      // ---- turning cue data into text and back
      function describe(cue) {
        if (cue.type === "sound") return (cue.file || "") + (cue.volume != null && cue.volume !== 1 ? ` @ ${Math.round(cue.volume * 100)}%` : "") + (cue.loop ? " ↻" : "");
        if (cue.type === "midi") return (cue.bytes || []).join(", ");
        const n = Object.keys(cue.levels || {}).length;
        return n ? `${n} channel${n > 1 ? "s" : ""}` : "";
      }
      function parseLevels(text) {
        const levels = {};
        for (const pair of text.split(",")) {
          const [ch, lv] = pair.split(":").map((s) => Number(s.trim()));
          if (ch >= 1 && ch <= 512 && lv >= 0 && lv <= 255) levels[ch] = lv;
        }
        return levels;
      }
      const levelsText = (cue) => Object.entries(cue.levels || {}).map(([ch, lv]) => ch + ":" + lv).join(", ");

      // ---- drawing
      function render() {
        const live = cues[currentCue], next = cues[currentCue + 1];
        $("liveCue").textContent = live ? `${live.number} · ${live.label}` : "—";
        $("nextCue").textContent = next ? `${next.number} · ${next.label}` : (cues.length ? "End of show" : "—");

        const body = $("cues");
        body.innerHTML = "";
        cues.forEach((cue, i) => {
          const tr = document.createElement("tr");
          tr.className = "cue" + (i === currentCue ? " live" : "") + (i === currentCue + 1 ? " standby" : "") + (i === selected ? " selected" : "");
          tr.innerHTML = `<td>${cue.number}</td><td>${cue.label}</td>
            <td><span class="badge ${cue.type}">${cue.type}</span></td>
            <td>${describe(cue)}</td><td>${cue.type === "light" ? (cue.fade ?? 0) + (cue.downFade !== undefined ? " / " + cue.downFade : "") : ""}</td>
            <td class="follow">${cue.autoFollow ? "⤵ " + (cue.wait || 0) + "s" : ""}</td>
            <td class="notes">${cue.notes || ""}</td>`;
          tr.onclick = () => select(i);
          tr.ondblclick = () => socket.emit("setStandby", i);
          body.appendChild(tr);
        });
        document.querySelector("tr.standby")?.scrollIntoView({ block: "nearest" });
      }

      function select(i) {
        if (i < 0 || i >= cues.length) return;
        selected = i;
        render();
        fillInspector();
        document.querySelector("tr.selected")?.scrollIntoView({ block: "nearest" });
      }

      function showFields(type) {
        for (const box of document.querySelectorAll("[data-for]")) box.hidden = box.dataset.for !== type;
      }
      function fillInspector() {
        const cue = cues[selected];
        $("noneSelected").hidden = !!cue;
        $("fields").hidden = !cue;
        if (!cue) return;
        $("f-number").value = cue.number;
        $("f-label").value = cue.label;
        $("f-type").value = cue.type;
        $("f-fade").value = cue.fade ?? 0;
        $("f-levels").value = levelsText(cue);
        $("f-file").value = cue.file || "";
        $("f-volume").value = cue.volume ?? 1;
        $("f-fadein").value = cue.fadeIn ?? 0;
        $("f-fadeout").value = cue.fadeOut ?? 1;
        $("f-loop").checked = !!cue.loop;
        $("f-bytes").value = (cue.bytes || []).join(", ");
        $("f-follow").checked = !!cue.autoFollow;
        $("f-wait").value = cue.wait ?? 0;
        $("f-notes").value = cue.notes || "";
        showFields(cue.type);
      }

      // ---- editing: every change in the inspector is saved straight away.
      // Only the changed field is written, so changes made on other pages meanwhile (e.g. lights in Blind) survive.
      const FIELDS = {
        "f-number": (c, el) => (c.number = el.value),
        "f-label": (c, el) => (c.label = el.value),
        "f-fade": (c, el) => { c.fade = Number(el.value) || 0; delete c.downFade; }, // one fade here: up and down the same
        "f-levels": (c, el) => (c.levels = parseLevels(el.value)),
        "f-file": (c, el) => (c.file = el.value),
        "f-volume": (c, el) => (c.volume = Number(el.value) || 1),
        "f-fadein": (c, el) => (c.fadeIn = Number(el.value) || 0),
        "f-fadeout": (c, el) => (c.fadeOut = el.value === "" ? 1 : Number(el.value) || 0),
        "f-loop": (c, el) => (c.loop = el.checked),
        "f-bytes": (c, el) => (c.bytes = el.value.split(",").map((s) => Number(s.trim())).filter((n) => !Number.isNaN(n))),
        "f-follow": (c, el) => (c.autoFollow = el.checked),
        "f-wait": (c, el) => (c.wait = Number(el.value) || 0),
        "f-notes": (c, el) => (c.notes = el.value),
      };
      function changeField(el) {
        if (selected < 0) return;
        if (el.id === "f-type") return readInspector(); // a new type starts from the inspector's fields
        const cue = { ...cues[selected] };
        FIELDS[el.id]?.(cue, el);
        cues[selected] = cue;
        socket.emit("saveCues", cues);
      }
      function readInspector() {
        if (selected < 0) return;
        const cue = {
          number: $("f-number").value,
          label: $("f-label").value,
          type: $("f-type").value,
          autoFollow: $("f-follow").checked,
          wait: Number($("f-wait").value) || 0,
          notes: $("f-notes").value,
        };
        if (cue.type === "light") {
          const old = cues[selected];
          cue.fade = Number($("f-fade").value) || 0;
          cue.levels = parseLevels($("f-levels").value);
          // a separate fade-down time (set on the lights page) stays unless the fade itself was changed here
          if (old.downFade !== undefined && cue.fade === old.fade) cue.downFade = old.downFade;
        }
        if (cue.type === "sound") {
          cue.file = $("f-file").value;
          cue.volume = Number($("f-volume").value) || 1;
          cue.fadeIn = Number($("f-fadein").value) || 0;
          cue.fadeOut = $("f-fadeout").value === "" ? 1 : Number($("f-fadeout").value) || 0;
          cue.loop = $("f-loop").checked;
        }
        if (cue.type === "midi") cue.bytes = $("f-bytes").value.split(",").map((s) => Number(s.trim())).filter((n) => !Number.isNaN(n));
        cues[selected] = cue;
        showFields(cue.type);
        socket.emit("saveCues", cues);
      }
      for (const el of document.querySelectorAll("#fields input, #fields select, #fields textarea")) el.onchange = () => changeField(el);

      $("add").onclick = () => {
        const at = selected >= 0 ? selected + 1 : cues.length; // new cue goes after the selected one
        cues.splice(at, 0, { number: String(cues.length + 1), label: "New cue", type: "light", fade: 0, levels: {} });
        selected = at;
        socket.emit("saveCues", cues);
        fillInspector();
      };
      $("delete").onclick = () => {
        if (selected < 0) return;
        cues.splice(selected, 1);
        selected = Math.min(selected, cues.length - 1);
        socket.emit("saveCues", cues);
        fillInspector();
      };
      function move(dir) {
        const to = selected + dir;
        if (selected < 0 || to < 0 || to >= cues.length) return;
        [cues[selected], cues[to]] = [cues[to], cues[selected]];
        selected = to;
        socket.emit("saveCues", cues);
      }
      $("up").onclick = () => move(-1);
      $("down").onclick = () => move(1);

      // ---- house / work light faders (made on the lights page; the stage manager often runs the house lights)
      let faders = [], faderPos = [], faderKey = "";
      function buildFaders() {
        const key = faders.map((f) => f.name).join("|");
        if (key === faderKey) return paintFaders(); // same faders: don't rebuild under the user's mouse
        faderKey = key;
        const box = $("smFaders");
        box.innerHTML = "";
        faders.forEach((f, k) => {
          const label = document.createElement("label");
          label.innerHTML = `<span></span><input type="range" min="0" max="100" value="0">`;
          label.querySelector("span").textContent = f.name;
          const range = label.querySelector("input");
          range.oninput = () => socket.emit("faderPos", { index: k, pos: range.value / 100 });
          range.onchange = () => range.blur(); // Space goes back to being GO
          box.appendChild(label);
        });
        paintFaders();
      }
      function paintFaders() {
        $("smFaders").querySelectorAll("label").forEach((label, k) => {
          const range = label.querySelector("input"), pct = Math.round((faderPos[k] || 0) * 100);
          if (document.activeElement !== range) range.value = pct;
          label.querySelector("span").textContent = `${faders[k].name} ${pct}%`;
        });
      }
      socket.on("faderPos", (p) => { faderPos = p || []; paintFaders(); });

      installLiveScript($("liveScript"), socket);


      // ---- the server is the source of truth: whatever it sends, we draw
      socket.on("state", (state) => {
        const sel = $("f-file"), keep = sel.value;
        sel.innerHTML = "";
        state.audioFiles.forEach((f) => sel.add(new Option(f, f)));
        if (keep) sel.value = keep;

        // Other pages can add or remove cues, so find the picked cue again by its number
        const was = cues[selected];
        cues = state.cues;
        currentCue = state.currentCue;
        faders = state.faders || [];
        buildFaders();
        if (currentCue >= 0 && !showStart) showStart = Date.now();
        if (currentCue < 0) { showStart = null; $("clock").textContent = "00:00"; }
        selected = was ? cues.findIndex((c) => c.type === was.type && c.number === was.number) : -1;
        render();
        if (!$("fields").contains(document.activeElement)) fillInspector(); // don't overwrite a field mid-typing
      });
    </script>
  </body>
</html>
