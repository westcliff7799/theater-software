<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Script</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      :root { --purple: #8f7fd8; --green: #3fdc5a; }
      body { background: #171717; }

      header { background: #1b1b1b; justify-content: space-between; font-family: Menlo, monospace; }
      header .tag { font-size: 12px; letter-spacing: 4px; color: var(--dim); }
      header .status { font-size: 12px; color: var(--dim); }
      header .title { font-size: 15px; color: #ccc; border-left: 1px solid var(--line); padding-left: 14px; }

      main { display: block; overflow: auto; padding: 16px 0 60vh; }

      .line {
        display: grid;
        grid-template-columns: 70px 1fr;
        gap: 12px;
        padding: 12px 24px 12px 0;
        border-left: 5px solid transparent;
        font-size: 24px;
        line-height: 1.3;
        color: #c8c8c8;
      }
      .line .num { font-family: Menlo, monospace; font-size: 13px; letter-spacing: 2px; color: var(--dim); text-align: right; padding-top: 7px; }
      .line .speaker { display: block; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
      .line.live { background: #0f0f0f; border-left-color: var(--green); color: #fff; font-size: 28px; font-weight: 600; }
      .line.live .num { color: #fff; }

      /* cue markers sit between lines, just above the line they fire on */
      .marker {
        margin: 6px 0 2px 82px;
        display: inline-block;
        padding: 3px 10px 3px 8px;
        border-left: 4px solid var(--purple);
        background: #1d1b2b;
        color: var(--purple);
        font-size: 14px;
        font-style: italic;
      }
      .marker.done { text-decoration: line-through; opacity: 0.55; }
      .marker.live { border-left-color: var(--green); color: var(--green); background: #122116; font-style: normal; }
      .marker.standby {
        display: flex; align-items: center; gap: 14px;
        margin: 10px 0 8px 82px;
        padding: 12px 18px;
        max-width: 480px;
        background: var(--standby);
        border-left: 6px solid #8c6d10;
        color: #111;
        font-size: 20px;
        font-style: normal;
        font-weight: 700;
        box-shadow: 0 0 24px rgba(242, 201, 76, 0.35);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .marker.standby .word { font-family: Menlo, monospace; font-size: 15px; letter-spacing: 4px; }
      @keyframes pulse { 50% { box-shadow: 0 0 6px rgba(242, 201, 76, 0.2); } }

      .empty { padding: 24px; color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <span class="tag">SCRIPT</span>
      <span class="status" id="status">Top of show</span>
      <span class="title" id="title"></span>
    </header>

    <main id="script"></main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const $ = (id) => document.getElementById(id);

      // Script lines in show.json look like { speaker: "HAMLET", text: "To be...", cue: "3" }.
      // "cue" is optional and may be a list if several cues fire on one line.
      socket.on("state", ({ currentCue, cues, script, title }) => {
        $("title").textContent = title || "";
        const box = $("script");
        box.innerHTML = "";

        // Which cue number is live, which is next, and which have already fired
        const byNumber = new Map(cues.map((c, i) => [c.number, i]));
        const liveNumber = cues[currentCue]?.number;
        const nextNumber = cues[currentCue + 1]?.number;
        const fired = (number) => byNumber.has(number) && byNumber.get(number) <= currentCue;

        $("status").textContent = liveNumber
          ? `LIVE ${liveNumber}   ·   STANDBY ${nextNumber ?? "end"}`
          : `STANDBY ${nextNumber ?? "–"}`;

        if (!script || script.length === 0) {
          box.innerHTML = '<p class="empty">No script yet. Add a "script" list to show.json.</p>';
          return;
        }

        script.forEach((line, n) => {
          // Cue markers first, so they appear just above their line
          for (const number of [].concat(line.cue || [])) {
            const cue = cues[byNumber.get(number)];
            const label = cue ? `CUE ${cue.number} · ${cue.label}` : `CUE ${number} (not in cue list)`;
            const m = document.createElement("div");
            if (number === nextNumber) {
              m.className = "marker standby";
              m.innerHTML = `<span class="word">STANDBY</span><span>${label}</span>`;
            } else if (number === liveNumber) {
              m.className = "marker live";
              m.textContent = "GO  " + label;
            } else {
              m.className = "marker" + (fired(number) ? " done" : "");
              m.textContent = label;
            }
            box.appendChild(m);
          }

          const div = document.createElement("div");
          div.className = "line" + ([].concat(line.cue || []).includes(liveNumber) ? " live" : "");
          div.innerHTML = `
            <span class="num">${String(n + 1).padStart(3, "0")}</span>
            <span>${line.speaker ? `<span class="speaker">${line.speaker}</span>` : ""}${line.text || ""}</span>`;
          box.appendChild(div);
        });

        // Keep the live line (or the standby marker) in view as the show moves on
        const focus = box.querySelector(".line.live") || box.querySelector(".marker.standby");
        if (focus) focus.scrollIntoView({ block: "center", behavior: "smooth" });
      });
    </script>
  </body>
</html>
