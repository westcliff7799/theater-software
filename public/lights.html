<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lights</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    header select, header input[type=text] { padding: 6px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    header .master { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; margin-left: 16px; }
    header .master input { width: 120px; }
    button.blackout.on { background: #8f1f1f; border-color: #8f1f1f; }

    main { grid-template-columns: 1fr 300px; }
    .left { display: flex; flex-direction: column; overflow: hidden; }
    .tabs { display: flex; gap: 4px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
    .tabs button { border-radius: 6px 6px 0 0; border-bottom: none; }
    .tabs button.on { background: var(--panel); color: var(--accent); }
    .tab { display: none; flex: 1; overflow: auto; }
    .tab.on { display: block; }

    /* stage plot: top of the box is upstage, bottom is the audience */
    #stage { position: relative; margin: 16px; height: calc(100% - 32px); min-height: 360px; background: #0a0a0a; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    #stage .edge { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; color: var(--dim); font-size: 11px; text-align: center; border-top: 1px dashed var(--line); pointer-events: none; }
    .fx { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; border: 2px solid var(--line); cursor: grab; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: var(--text); text-shadow: 0 0 3px #000; user-select: none; touch-action: none; }
    .fx.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
    .fx small { position: absolute; top: 46px; width: 90px; text-align: center; color: var(--dim); font-size: 10px; font-weight: normal; }

    /* live table, Eos style: one row per channel, one column per parameter */
    .live td.val { font-family: Menlo, monospace; text-align: center; width: 70px; color: var(--dim); }
    .live td.val.on { color: var(--text); }
    .live td.int.on { color: var(--standby); font-weight: bold; }
    .live tr.sel { background: #1a2740; }
    .live td.swatch { width: 18px; padding: 0; }
    .live td.swatch div { width: 14px; height: 14px; border-radius: 3px; margin: 0 auto; border: 1px solid var(--line); }
    .timing { display: flex; gap: 10px; align-items: center; padding: 12px 16px; color: var(--dim); font-size: 13px; border-top: 1px solid var(--line); }
    .timing input { width: 70px; padding: 4px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }

    /* patch table */
    .patch { padding: 16px; }
    .patch input, .patch select { padding: 4px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; width: 100%; }
    .patch td:last-child { width: 50px; }

    /* raw channel faders */
    .chanBar { padding: 12px 16px 0; color: var(--dim); font-size: 12px; }
    .chanBar input { width: 60px; padding: 4px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    .faders { display: grid; grid-template-columns: repeat(24, 1fr); gap: 6px; padding: 16px; }
    .fader { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
    .fader input { writing-mode: vertical-lr; direction: rtl; height: 160px; width: 24px; }
    .fader b { color: var(--text); }
    .fader.patched span { color: var(--accent); }

    /* command line */
    .cmd { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
    .cmd input { flex: 1; padding: 8px; font-family: Menlo, monospace; font-size: 14px; background: #111; color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
    .cmd span { color: var(--dim); font-size: 12px; white-space: nowrap; }

    /* selection panel */
    .inspector h3 { margin: 0 0 4px; }
    .inspector .who { color: var(--dim); font-size: 13px; min-height: 40px; }
    .level { font-size: 44px; font-weight: bold; text-align: center; margin: 8px 0 0; }
    .big { width: 100%; margin: 8px 0 12px; }
    .row { display: flex; gap: 6px; margin: 8px 0; }
    .row button { flex: 1; }
    .swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .swatch { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
    #colorBox { margin-top: 20px; }
    #colorBox.off { opacity: 0.25; pointer-events: none; }
    #colorBox input[type=color] { width: 100%; height: 40px; padding: 0; border: 1px solid var(--line); background: #111; border-radius: 4px; }
  </style>
</head>
<body>
    <script src="/nav.js"></script>
  <header>
    <h1>Lights</h1>
    <select id="target"></select>
    <button id="load">Go to cue</button>
    <button id="record">Record into cue</button>
    <input id="newLabel" type="text" placeholder="New look name">
    <button id="recordNew">Record as new</button>
    <button id="clear">Clear all</button>
    <label class="master">Master <input id="master" type="range" min="0" max="255" value="255"> <b id="masterText">100%</b></label>
    <button id="blackout" class="blackout">Blackout</button>
  </header>

  <main>
    <div class="left">
      <div class="tabs">
        <button class="on" data-tab="stageTab">Stage</button>
        <button data-tab="liveTab">Live Table</button>
        <button data-tab="patchTab">Patch</button>
        <button data-tab="chanTab">Channels</button>
      </div>

      <div class="tab on" id="stageTab">
        <div id="stage"><div class="edge">AUDIENCE</div></div>
      </div>

      <div class="tab live" id="liveTab">
        <table>
          <thead><tr><th>Ch</th><th>Name</th><th>Addr</th><th></th><th>Int</th><th>Red</th><th>Green</th><th>Blue</th><th>White</th></tr></thead>
          <tbody id="liveRows"></tbody>
        </table>
        <div class="timing">
          Timing for cue <b id="timingCue">–</b>: fade
          <input id="cueFade" type="number" min="0" step="0.1"> seconds
        </div>
      </div>

      <div class="tab patch" id="patchTab">
        <table>
          <thead><tr><th>#</th><th>Name</th><th>Type</th><th>Address</th><th>Uses</th><th></th></tr></thead>
          <tbody id="patchRows"></tbody>
        </table>
        <p><button id="addFixture">+ Add fixture</button></p>
      </div>

      <div class="tab" id="chanTab">
        <div class="chanBar">Show channels 1 to <input id="chCount" type="number" min="1" max="512" value="48"> (blue numbers are patched)</div>
        <div class="faders" id="faders"></div>
      </div>

      <div class="cmd">
        <input id="cmd" placeholder="1 thru 4 @ 50   ·   1 + 3 @ full   ·   all @ out">
        <span id="hint">Enter to run</span>
      </div>
    </div>

    <aside class="inspector">
      <h3>Selected</h3>
      <div class="who" id="who"></div>
      <div class="level" id="levelText">0%</div>
      <input class="big" id="intensity" type="range" min="0" max="255" value="0">
      <div class="row">
        <button data-lv="255">Full</button>
        <button data-lv="191">75</button>
        <button data-lv="128">50</button>
        <button data-lv="64">25</button>
        <button data-lv="0">Out</button>
      </div>
      <div id="colorBox">
        <h3>Colour</h3>
        <input id="picker" type="color" value="#ffffff">
        <div class="swatches" id="swatches"></div>
      </div>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);

    // Fixture types: how many DMX channels each uses and what each channel does.
    // The number is the offset from the fixture's start address. i = intensity.
    const TYPES = {
      dimmer: { ch: 1, i: 0 },
      rgb:    { ch: 3, r: 0, g: 1, b: 2 },
      rgbw:   { ch: 4, r: 0, g: 1, b: 2, w: 3 },
      irgb:   { ch: 4, i: 0, r: 1, g: 2, b: 3 },
    };

    let dmx = new Array(512).fill(0); // live levels, always from the server
    let patch = [];                    // fixtures from show.json
    let cues = [];
    let selected = new Set();          // fixture indexes
    const memory = new Map();          // fixture index -> last colour, for fixtures whose colour channels go to 0 when dark
    let master = 255, beforeBlackout = 255;

    // ---- reading a fixture out of the raw DMX array
    const hasColor = (f) => "r" in TYPES[f.type];
    const hasDimmer = (f) => "i" in TYPES[f.type];
    const chan = (f, key) => dmx[f.address - 1 + TYPES[f.type][key]] ?? 0;

    function level(i) {
      const f = patch[i];
      if (hasDimmer(f)) return chan(f, "i");
      return Math.max(chan(f, "r"), chan(f, "g"), chan(f, "b"));
    }
    function color(i) {
      const f = patch[i];
      if (!hasColor(f)) return null;
      const raw = { r: chan(f, "r"), g: chan(f, "g"), b: chan(f, "b") };
      if (hasDimmer(f)) return raw; // colour channels hold the colour itself
      const max = Math.max(raw.r, raw.g, raw.b);
      if (max === 0) return memory.get(i) || { r: 255, g: 255, b: 255 };
      return { r: Math.round(raw.r * 255 / max), g: Math.round(raw.g * 255 / max), b: Math.round(raw.b * 255 / max) };
    }

    // ---- writing: turn "this fixture at this level and colour" into channel numbers
    function channelsFor(i, lv, c) {
      const f = patch[i], T = TYPES[f.type], out = {};
      if (hasDimmer(f)) out[f.address + T.i] = lv;
      if (hasColor(f)) {
        const scale = hasDimmer(f) ? 1 : lv / 255; // no dimmer channel: brightness lives in the colour channels
        out[f.address + T.r] = Math.round(c.r * scale);
        out[f.address + T.g] = Math.round(c.g * scale);
        out[f.address + T.b] = Math.round(c.b * scale);
        if ("w" in T) out[f.address + T.w] = Math.round(Math.min(c.r, c.g, c.b) * scale);
      }
      return out;
    }
    function setSelection(lv, c) {
      const all = {};
      for (const i of selected) {
        if (c) memory.set(i, c);
        Object.assign(all, channelsFor(i, lv ?? level(i), c ?? color(i) ?? { r: 255, g: 255, b: 255 }));
      }
      if (Object.keys(all).length) socket.emit("setChannels", all);
    }

    // ---- stage plot
    function buildStage() {
      const box = $("stage");
      box.querySelectorAll(".fx").forEach((e) => e.remove());
      patch.forEach((f, i) => {
        const el = document.createElement("div");
        el.className = "fx";
        el.id = "fx" + i;
        el.innerHTML = `${i + 1}<small></small>`;
        el.onpointerdown = (e) => startDrag(e, i, el);
        box.appendChild(el);
      });
      paintStage();
    }
    function paintStage() {
      patch.forEach((f, i) => {
        const el = $("fx" + i);
        if (!el) return;
        const lv = level(i), c = color(i) || { r: 255, g: 225, b: 170 }; // plain dimmers glow warm white
        el.style.left = (f.x ?? 50) + "%";
        el.style.top = (f.y ?? 50) + "%";
        el.style.background = `rgb(${c.r * lv / 255 | 0}, ${c.g * lv / 255 | 0}, ${c.b * lv / 255 | 0})`;
        el.classList.toggle("sel", selected.has(i));
        el.querySelector("small").textContent = `${f.name} ${Math.round(lv / 255 * 100)}%`;
      });
    }
    function startDrag(e, i, el) {
      e.preventDefault();
      const rect = $("stage").getBoundingClientRect();
      let moved = false;
      const move = (ev) => {
        if (!moved && Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) < 4) return;
        moved = true;
        patch[i].x = Math.round(Math.max(3, Math.min(97, (ev.clientX - rect.left) / rect.width * 100)));
        patch[i].y = Math.round(Math.max(6, Math.min(90, (ev.clientY - rect.top) / rect.height * 100)));
        el.style.left = patch[i].x + "%";
        el.style.top = patch[i].y + "%";
      };
      const up = () => {
        window.removeEventListener("pointermove", move);
        window.removeEventListener("pointerup", up);
        if (moved) return socket.emit("savePatch", patch);
        if (!e.shiftKey) selected.clear();         // plain click: just this one
        selected.has(i) ? selected.delete(i) : selected.add(i); // shift-click: toggle
        paintAll();
      };
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    }
    $("stage").onpointerdown = (e) => {
      if (e.target.id !== "stage") return; // clicked a fixture, not empty floor
      selected.clear();
      paintAll();
    };

    // ---- live table
    function buildLive() {
      const body = $("liveRows");
      body.innerHTML = "";
      patch.forEach((f, i) => {
        const tr = document.createElement("tr");
        tr.className = "cue";
        tr.id = "live" + i;
        tr.innerHTML = `<td>${i + 1}</td><td>${f.name}</td><td>${f.address}</td>
          <td class="swatch"><div></div></td>
          <td class="val int"></td><td class="val"></td><td class="val"></td><td class="val"></td><td class="val"></td>`;
        tr.onclick = (e) => {
          if (!e.shiftKey) selected.clear();
          selected.has(i) ? selected.delete(i) : selected.add(i);
          paintAll();
        };
        body.appendChild(tr);
      });
    }
    const pct = (v) => Math.round(v / 255 * 100);
    function paintLive() {
      patch.forEach((f, i) => {
        const tr = $("live" + i);
        if (!tr) return;
        const T = TYPES[f.type], lv = level(i), c = color(i);
        const cells = tr.querySelectorAll("td.val");
        const show = (cell, v) => { // a blank cell means the fixture has no such parameter
          cell.textContent = v === null ? "" : pct(v);
          cell.classList.toggle("on", v !== null && v > 0);
        };
        show(cells[0], lv);
        show(cells[1], c ? chan(f, "r") : null);
        show(cells[2], c ? chan(f, "g") : null);
        show(cells[3], c ? chan(f, "b") : null);
        show(cells[4], "w" in T ? chan(f, "w") : null);
        const glow = c || { r: 255, g: 225, b: 170 };
        tr.querySelector("td.swatch div").style.background = `rgb(${glow.r * lv / 255 | 0}, ${glow.g * lv / 255 | 0}, ${glow.b * lv / 255 | 0})`;
        tr.classList.toggle("sel", selected.has(i));
      });
    }
    function paintTiming() {
      const cue = cues[Number($("target").value)];
      $("timingCue").textContent = cue ? cue.number + " " + cue.label : "–";
      $("cueFade").value = cue ? cue.fade ?? 0 : "";
    }
    $("target").onchange = paintTiming;
    $("cueFade").onchange = (e) => {
      const cue = cues[Number($("target").value)];
      if (!cue) return;
      cue.fade = Number(e.target.value) || 0;
      socket.emit("saveCues", cues);
    };

    // ---- patch table
    function buildPatch() {
      const body = $("patchRows");
      body.innerHTML = "";
      patch.forEach((f, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${i + 1}</td>
          <td><input data-k="name"></td>
          <td><select data-k="type">${Object.keys(TYPES).map((t) => `<option>${t}</option>`).join("")}</select></td>
          <td><input data-k="address" type="number" min="1" max="512"></td>
          <td>${f.address} to ${f.address + TYPES[f.type].ch - 1}</td>
          <td><button title="Remove">✕</button></td>`;
        for (const inp of tr.querySelectorAll("[data-k]")) {
          inp.value = f[inp.dataset.k];
          inp.onchange = () => {
            f[inp.dataset.k] = inp.type === "number" ? Number(inp.value) : inp.value;
            f.address = Math.max(1, Math.min(512 - TYPES[f.type].ch + 1, f.address || 1));
            socket.emit("savePatch", patch);
          };
        }
        tr.querySelector("button").onclick = () => {
          patch.splice(i, 1);
          selected.clear();
          socket.emit("savePatch", patch);
        };
        body.appendChild(tr);
      });
    }
    $("addFixture").onclick = () => {
      const last = patch[patch.length - 1];
      patch.push({
        name: "Fixture " + (patch.length + 1),
        type: "dimmer",
        address: last ? last.address + TYPES[last.type].ch : 1, // next free address after the last fixture
        x: 10 + (patch.length * 11) % 80,
        y: 60,
      });
      socket.emit("savePatch", patch);
    };

    // ---- raw channel faders
    function buildFaders() {
      const n = Math.max(1, Math.min(512, Number($("chCount").value) || 24));
      const box = $("faders");
      box.innerHTML = "";
      for (let ch = 1; ch <= n; ch++) {
        const div = document.createElement("div");
        div.className = "fader";
        div.id = "fader" + ch;
        div.innerHTML = `<input type="range" min="0" max="255" value="0"><b>0</b><span>${ch}</span>`;
        div.querySelector("input").oninput = (e) =>
          socket.emit("setChannel", { channel: ch, level: Number(e.target.value) });
        box.appendChild(div);
      }
      paintFaders();
    }
    function paintFaders() {
      const patched = new Set();
      for (const f of patch) for (let k = 0; k < TYPES[f.type].ch; k++) patched.add(f.address + k);
      for (const div of $("faders").children) {
        const ch = Number(div.querySelector("span").textContent);
        div.querySelector("input").value = dmx[ch - 1];
        div.querySelector("b").textContent = dmx[ch - 1];
        div.classList.toggle("patched", patched.has(ch));
      }
    }
    $("chCount").onchange = buildFaders;

    // ---- selection panel
    const hex = ({ r, g, b }) => "#" + [r, g, b].map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
    const rgb = (h) => ({ r: parseInt(h.slice(1, 3), 16), g: parseInt(h.slice(3, 5), 16), b: parseInt(h.slice(5, 7), 16) });

    function paintPanel() {
      const list = [...selected];
      $("who").textContent = list.length
        ? list.map((i) => `${i + 1} ${patch[i].name}`).join(", ")
        : "Click fixtures on the stage (shift-click for more), or type 1 thru 4 below";
      const lv = list.length ? level(list[0]) : 0;
      $("intensity").value = lv;
      $("levelText").textContent = Math.round(lv / 255 * 100) + "%";
      const colourful = list.find((i) => hasColor(patch[i]));
      $("colorBox").classList.toggle("off", colourful === undefined);
      if (colourful !== undefined) $("picker").value = hex(color(colourful));
    }
    $("intensity").oninput = (e) => setSelection(Number(e.target.value), null);
    for (const b of document.querySelectorAll("[data-lv]")) b.onclick = () => setSelection(Number(b.dataset.lv), null);
    $("picker").oninput = (e) => setSelection(null, rgb(e.target.value));
    for (const h of ["#ffffff", "#ffb050", "#ff2020", "#ff8000", "#ffe000", "#20ff40", "#00e0ff", "#2050ff", "#a030ff", "#ff40c0"]) {
      const s = document.createElement("div");
      s.className = "swatch";
      s.style.background = h;
      s.onclick = () => setSelection(null, rgb(h));
      $("swatches").appendChild(s);
    }

    // ---- command line:  "1 thru 4 @ 50"   "1 + 3 @ full"   "all @ out"   "2" (just select)
    function runCommand(text) {
      const t = text.trim().toLowerCase().replace(/\s+/g, " ").replace(/ at /g, " @ ");
      if (!t) return;
      const [selPart, lvPart] = t.split("@").map((s) => s.trim());
      if (selPart) {
        const picks = new Set();
        if (selPart === "all") patch.forEach((_, i) => picks.add(i));
        else for (const part of selPart.split("+")) {
          const m = part.trim().match(/^(\d+)(?: ?(?:thru|-|>) ?(\d+))?$/);
          if (!m) return hint("Didn't understand that. Try: 1 thru 4 @ 50");
          const a = Number(m[1]), b = Number(m[2] || m[1]);
          for (let n = Math.min(a, b); n <= Math.max(a, b); n++) if (patch[n - 1]) picks.add(n - 1);
        }
        selected = picks;
      }
      if (lvPart !== undefined) {
        const lv = lvPart === "full" ? 255 : lvPart === "out" ? 0 : Math.round(Math.min(100, Number(lvPart)) * 2.55);
        if (Number.isNaN(lv)) return hint("Level must be 0 to 100, full, or out");
        setSelection(lv, null);
      }
      paintAll();
      hint("Enter to run");
      $("cmd").value = "";
    }
    const hint = (msg) => ($("hint").textContent = msg);
    $("cmd").onkeydown = (e) => { if (e.key === "Enter") runCommand(e.target.value); };

    // ---- header: cues, master, blackout, tabs
    $("load").onclick = () => socket.emit("loadCue", Number($("target").value));
    $("record").onclick = () => socket.emit("recordCue", { index: Number($("target").value) });
    $("recordNew").onclick = () => socket.emit("recordCue", { index: -1, label: $("newLabel").value });
    $("clear").onclick = () => socket.emit("clearAll");
    $("master").oninput = (e) => socket.emit("setMaster", Number(e.target.value));
    $("blackout").onclick = () => {
      if (master > 0) { beforeBlackout = master; socket.emit("setMaster", 0); }
      else socket.emit("setMaster", beforeBlackout || 255);
    };
    for (const b of document.querySelectorAll(".tabs button")) b.onclick = () => {
      document.querySelectorAll(".tabs button, .tab").forEach((el) => el.classList.remove("on"));
      b.classList.add("on");
      $(b.dataset.tab).classList.add("on");
    };

    // ---- the server is the source of truth
    function paintAll() { paintStage(); paintLive(); paintFaders(); paintPanel(); }

    socket.on("dmx", (d) => { dmx = d; paintAll(); });

    socket.on("state", (state) => {
      cues = state.cues;
      patch = state.patch || [];
      master = state.master ?? 255;
      selected = new Set([...selected].filter((i) => i < patch.length));

      const sel = $("target"), keep = sel.value;
      sel.innerHTML = "";
      cues.forEach((cue, i) => { if (cue.type === "light") sel.add(new Option(cue.number + "  " + cue.label, i)); });
      if (keep) sel.value = keep;

      $("master").value = master;
      $("masterText").textContent = Math.round(master / 255 * 100) + "%";
      $("blackout").classList.toggle("on", master === 0);
      $("blackout").textContent = master === 0 ? "Restore" : "Blackout";

      buildStage();
      buildLive();
      buildPatch();
      paintTiming();
      paintAll();
    });

    buildFaders();
  </script>
</body>
</html>
